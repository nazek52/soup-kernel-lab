name: Correctness
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  cpu-and-interpreter:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU test environment
        run: |
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev]' triton==3.4.0
      - name: Lint authored code
        run: python -m ruff check soup_lab dev_tests scripts solution/ops.py solution/kernels.py solution/test_candidate.py
      - name: CPU and fallback tests
        run: python -m pytest solution dev_tests -q
      - name: Actual Triton kernel arithmetic via CPU interpreter
        env:
          TRITON_INTERPRET: '1'
        run: python -m pytest dev_tests/test_interpreter.py -q
      - name: Produce reproducible demonstration
        run: python -m soup_lab demo --output reports/ci-demo
      - uses: actions/upload-artifact@v4
        with:
          name: cpu-demonstration
          path: reports/ci-demo
