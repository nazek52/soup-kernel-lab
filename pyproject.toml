[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "soup-kernel-lab"
version = "0.1.0"
description = "Reproducible Triton kernel correctness and Soup training benchmark lab"
requires-python = ">=3.11,<3.14"
license = "Apache-2.0"
dependencies = ["torch>=2.6", "numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9"]

[project.scripts]
soup-lab = "soup_lab.__main__:main"

[tool.setuptools.packages.find]
include = ["soup_lab*", "solution*"]

[tool.pytest.ini_options]
testpaths = ["solution", "dev_tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
